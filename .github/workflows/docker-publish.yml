name: Build and Publish Container Packages

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish-containers:
    name: Build & Publish All 4 Custom Microservices
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Run Server Unit Tests
        run: |
          go test -v ./server/audit/ ./server/cache/ ./server/pricing/ ./server/webhook/

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 1. Go MCP Gateway Server
      - name: Extract metadata for Gateway Server
        id: meta-server
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-server
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}}

      - name: Build and push Gateway Server Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta-server.outputs.tags }}
          labels: ${{ steps.meta-server.outputs.labels }}

      # 2. Merchant Storefront & Margin Defense Dashboard
      - name: Extract metadata for Merchant Dashboard
        id: meta-dashboard
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-dashboard
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}}

      - name: Build and push Dashboard Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./dashboard
          file: ./dashboard/Dockerfile
          push: true
          tags: ${{ steps.meta-dashboard.outputs.tags }}
          labels: ${{ steps.meta-dashboard.outputs.labels }}

      # 3. Customer UPI Circle Smartphone Simulator
      - name: Extract metadata for Customer UPI Simulator
        id: meta-upi
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-customer-upi-app
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}}

      - name: Build and push Customer UPI App Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./customer-upi-app
          file: ./customer-upi-app/Dockerfile
          push: true
          tags: ${{ steps.meta-upi.outputs.tags }}
          labels: ${{ steps.meta-upi.outputs.labels }}

      # 4. Platform Fleet Admin Control Center
      - name: Extract metadata for Admin Dashboard
        id: meta-admin
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-admin-dashboard
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}}

      - name: Build and push Admin Dashboard Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./admin-dashboard
          file: ./admin-dashboard/Dockerfile
          push: true
          tags: ${{ steps.meta-admin.outputs.tags }}
          labels: ${{ steps.meta-admin.outputs.labels }}
