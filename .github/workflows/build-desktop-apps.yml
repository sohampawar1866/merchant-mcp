name: Build Desktop Control Center Release Assets

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS (ARM64)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build macOS Application
        run: |
          cd desktop-manager
          cd frontend && npm install && npm run build && cd ..
          wails build -platform darwin/arm64
          cd build/bin
          APP_NAME=$(ls -d *.app | head -n 1)
          hdiutil create -volname "AgenticCheckout" -srcfolder "$APP_NAME" -ov -format UDZO "AgenticCheckout-macOS-arm64.dmg"
          zip -r "AgenticCheckout-macOS-arm64.zip" "$APP_NAME"

      - name: Upload macOS Release Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            desktop-manager/build/bin/AgenticCheckout-macOS-arm64.dmg
            desktop-manager/build/bin/AgenticCheckout-macOS-arm64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    name: Build Windows (x64)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wails CLI
        shell: pwsh
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build Windows Executable
        shell: pwsh
        run: |
          cd desktop-manager
          cd frontend
          npm install
          npm run build
          cd ..
          wails build -platform windows/amd64 -o AgenticCheckout-Windows-x64.exe
          cd build/bin
          Compress-Archive -Path "AgenticCheckout-Windows-x64.exe" -DestinationPath "AgenticCheckout-Windows-x64.zip"

      - name: Upload Windows Release Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            desktop-manager/build/bin/AgenticCheckout-Windows-x64.exe
            desktop-manager/build/bin/AgenticCheckout-Windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    name: Build Linux (x64)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux Dependencies (WebKit & GTK)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev build-essential

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build Linux Binary
        run: |
          cd desktop-manager
          cd frontend
          npm install
          npm run build
          cd ..
          wails build -platform linux/amd64 -o AgenticCheckout-Linux-x64
          cd build/bin
          tar -czvf AgenticCheckout-Linux-x64.tar.gz AgenticCheckout-Linux-x64

      - name: Upload Linux Release Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            desktop-manager/build/bin/AgenticCheckout-Linux-x64
            desktop-manager/build/bin/AgenticCheckout-Linux-x64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
