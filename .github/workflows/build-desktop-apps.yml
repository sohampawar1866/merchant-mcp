name: Build Desktop Installer Release Assets

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build macOS ARM64 App
        run: |
          cd installer/frontend && npm install && npm run build && cd ..
          wails build -platform darwin/arm64 -o AgenticCheckout-macOS-arm64
          cd build/bin
          hdiutil create -volname "AgenticCheckout" -srcfolder "AgenticCheckout.app" -ov -format UDZO "AgenticCheckout-macOS-arm64.dmg"
          zip -r "AgenticCheckout-macOS-arm64.zip" "AgenticCheckout.app"

      - name: Upload macOS Release Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            installer/build/bin/AgenticCheckout-macOS-arm64.dmg
            installer/build/bin/AgenticCheckout-macOS-arm64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
